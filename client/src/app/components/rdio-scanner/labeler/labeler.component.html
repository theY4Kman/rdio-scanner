<div
  class="label-form"
  [ngClass]="{ visible: isConfiguringUnitLabel | async }"
  [cdkTrapFocusAutoCapture]="isConfiguringUnitLabel | async"
  [cdkTrapFocus]="isConfiguringUnitLabel | async"
>
  <ng-container *ngIf="!isAdminAuthenticated">
    <rdio-scanner-admin-login class="modal" [focused]="true" (blur)="this.labeler.cancelUnitLabelConfiguration()">
      Enter admin password to configure unit label
    </rdio-scanner-admin-login>
  </ng-container>
  <form
    *ngIf="isAdminAuthenticated"
    class="mat-elevation-z8"
    autocomplete="off"
    [formGroup]="unitLabelForm"
    (ngSubmit)="submitUnitLabelConfiguration()"
  >
    <button
      mat-icon-button
      class="close-button"
      type="button"
      (click)="labeler.cancelUnitLabelConfiguration()"
      title="Close (discard changes)"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>

    <mat-form-field>
      <input
        #unitLabelInput
        matInput
        autocomplete="off"
        formControlName="label"
        [placeholder]="(unitLabelPlaceholder$ | async) || 'Unit label'"
        onfocus="this.select()"
      >
    </mat-form-field>

    <div class="action-buttons">
      <button
        mat-button
        type="button"
        [disabled]="isLoading"
        (click)="searchForUnit()"
        title="Search for calls with this unit">
        <mat-icon>search</mat-icon>
        Search Calls
      </button>

      <button
        mat-button
        type="button"
        [disabled]="isLoading"
        (click)="showLabelHistory()"
        title="View label history for this unit">
        <mat-icon>history</mat-icon>
        Label History
      </button>

      <button
        mat-button
        color="warn"
        class="delete-button"
        type="button"
        [disabled]="this.labeler.unitLabelSource?.label == null || isLoading"
        (click)="onDeleteClick()"
        onclick="return false;"
      >{{ !didClickDelete ? 'Delete' : 'Really?' }}
      </button>
    </div>
  </form>
</div>
